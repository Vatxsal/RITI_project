<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>11 Sector Dashboards — Manthaan OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────
   GLOBAL TOKENS  (match existing dashboard CSS)
───────────────────────────────────────────── */
:root{
  --bg:#060d18; --bg1:#0c1828; --bg2:#111f33; --bg3:#162440;
  --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.13);
  --green:#34d399; --amber:#fbbf24; --red:#f87171; --purple:#a78bfa;
  --pink:#f472b6; --sky:#38bdf8; --teal:#2dd4bf; --orange:#fb923c;
  --lime:#a3e635;
  --text1:#f0f6ff; --text2:#8fa8c8; --text3:#4a6480;
  --mono:'Space Mono',monospace; --sans:'DM Sans',sans-serif;
  --r:12px; --r2:18px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text1);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 55% 35% at 15% 0%,var(--sector-glow,rgba(34,211,238,.055)) 0%,transparent 55%),
             radial-gradient(ellipse 40% 50% at 85% 90%,var(--sector-glow,rgba(34,211,238,.035)) 0%,transparent 55%)}

/* ─── SHELL ─── */
.shell{position:relative;z-index:1;max-width:1380px;margin:0 auto;padding:0 28px 64px}

/* ─── TOP BAR ─── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:20px 0 24px;border-bottom:1px solid var(--border);margin-bottom:24px;flex-wrap:wrap}
.topbar-left{display:flex;align-items:center;gap:14px}
.sector-icon{width:42px;height:42px;border-radius:11px;background:var(--s-dim);
  border:1px solid var(--s-border);display:grid;place-items:center;font-size:19px;flex-shrink:0}
.sector-title h1{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.sector-title .crumb{font-size:11px;color:var(--text3);font-family:var(--mono);
  letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.topbar-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.district-select{background:var(--bg2);border:1px solid var(--border2);color:var(--text1);
  border-radius:8px;padding:8px 14px;font-family:var(--sans);font-size:13px;
  outline:none;cursor:pointer;min-width:175px;transition:border-color .2s}
.district-select:focus{border-color:var(--s-color)}
.toggle-group{display:flex;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;overflow:hidden}
.toggle-btn{padding:8px 14px;font-size:12px;font-weight:600;font-family:var(--sans);color:var(--text3);
  background:transparent;border:none;cursor:pointer;transition:all .18s;white-space:nowrap}
.toggle-btn.active{background:var(--s-dim);color:var(--s-color);border-radius:6px}

/* ─── HERO ─── */
.hero{background:linear-gradient(130deg,#0c1f35 0%,#0a1826 60%,#071420 100%);
  border:1px solid var(--s-border);border-radius:var(--r2);padding:28px 32px 26px;
  margin-bottom:20px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:260px;height:260px;
  background:radial-gradient(circle,var(--s-glow),transparent 65%);border-radius:50%;pointer-events:none}
.hero-kicker{font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.18em;
  color:var(--s-color);margin-bottom:10px;opacity:.8}
.hero-headline{font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.25;
  color:var(--text1);max-width:740px;margin-bottom:18px}
.hero-headline span{color:var(--s-color)}
.hero-stats{display:flex;gap:36px;flex-wrap:wrap}
.hs-label{font-size:9px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em;
  color:var(--text3);margin-bottom:5px}
.hs-val{font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--text1);line-height:1}
.hs-note{font-size:10px;color:var(--text3);margin-top:3px;font-family:var(--mono)}
.hs-note.up{color:var(--green)} .hs-note.warn{color:var(--amber)} .hs-note.crit{color:var(--red)}

/* ─── SPLIT PILL ─── */
.split-pill{display:inline-flex;align-items:center;gap:16px;padding:8px 16px;
  background:var(--bg1);border:1px solid var(--border);border-radius:999px;
  font-size:11px;font-family:var(--mono);color:var(--text3);margin-bottom:22px}
.pdot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
.pdot.base{background:var(--purple)} .pdot.asp{background:var(--s-color)}
.split-pill .sep{color:var(--border2)} .split-pill .dlabel{color:var(--text2)}

/* ─── KPI ROW ─── */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:20px}
.kpi-card{background:var(--bg1);border:1px solid var(--border);border-top:2px solid transparent;
  border-radius:var(--r2);padding:18px 20px;position:relative;overflow:hidden;
  transition:border-color .2s,transform .2s}
.kpi-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.kpi-card.c-s{border-top-color:var(--s-color)}
.kpi-card.c-green{border-top-color:var(--green)}
.kpi-card.c-amber{border-top-color:var(--amber)}
.kpi-card.c-red{border-top-color:var(--red)}
.kpi-card.c-purple{border-top-color:var(--purple)}
.kpi-badge{position:absolute;top:14px;right:14px;font-size:8px;font-family:var(--mono);
  font-weight:700;letter-spacing:.1em;padding:3px 7px;border-radius:999px;text-transform:uppercase}
.kpi-badge.base{background:rgba(167,139,250,.13);color:var(--purple)}
.kpi-badge.asp{background:var(--s-dim);color:var(--s-color)}
.kpi-label{font-size:9px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em;
  color:var(--text3);margin-bottom:9px}
.kpi-value{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1;
  color:var(--text1);margin-bottom:5px}
.kpi-sub{font-size:11px;color:var(--text2)}
.kpi-sub strong{color:var(--s-color)}

/* ─── AI PANEL ─── */
.ai-panel{background:linear-gradient(135deg,var(--s-glow),rgba(251,191,36,.03));
  border:1px solid rgba(251,191,36,.14);border-radius:var(--r2);padding:20px 22px;
  margin-bottom:20px;position:relative;overflow:hidden}
.ai-panel::before{content:'';position:absolute;top:-28px;right:-28px;width:110px;height:110px;
  background:radial-gradient(circle,rgba(251,191,36,.07),transparent 65%);border-radius:50%;pointer-events:none}
.ai-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ai-dot{width:26px;height:26px;border-radius:8px;background:rgba(251,191,36,.10);
  border:1px solid rgba(251,191,36,.2);display:grid;place-items:center;font-size:12px;position:relative}
.ai-dot::after{content:'';position:absolute;inset:-3px;border-radius:10px;
  border:1px solid rgba(251,191,36,.18);animation:pring 2s ease infinite}
@keyframes pring{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.45)}}
.ai-hdr-text{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--amber);font-family:var(--mono)}
.ai-hdr-sub{font-size:9px;color:var(--text3);font-family:var(--mono);margin-top:1px}
.ai-refresh{margin-left:auto;background:transparent;border:1px solid rgba(251,191,36,.18);
  border-radius:7px;color:var(--amber);font-size:11px;font-family:var(--mono);
  padding:5px 11px;cursor:pointer;transition:all .2s}
.ai-refresh:hover{background:rgba(251,191,36,.08)}
.ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ai-card{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);
  border-radius:10px;padding:12px 14px;animation:fsi .35s ease both}
@keyframes fsi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.ai-card-type{font-size:8px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.12em;
  margin-bottom:5px;display:flex;align-items:center;gap:5px}
.ai-card-type.gap{color:var(--red)} .ai-card-type.trend{color:var(--sky)}
.ai-card-type.action{color:var(--green)} .ai-card-type.pattern{color:var(--purple)}
.ai-card-text{font-size:12px;color:var(--text2);line-height:1.55}
.ai-card-text strong{color:var(--text1)}
.ai-loading{display:flex;align-items:center;gap:9px;color:var(--text3);font-size:12px;padding:6px 0;grid-column:1/-1}
.spin{width:14px;height:14px;border:2px solid rgba(251,191,36,.2);border-top-color:var(--amber);
  border-radius:50%;animation:rot .7s linear infinite;flex-shrink:0}
@keyframes rot{to{transform:rotate(360deg)}}

/* ─── DIVIDERS ─── */
.divider{display:flex;align-items:center;gap:11px;margin:22px 0 18px;font-size:9px;
  font-family:var(--mono);text-transform:uppercase;letter-spacing:.16em;color:var(--text3)}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.divider.asp{color:var(--s-color)} .divider.base{color:var(--purple)}

/* ─── MAIN 2-COL GRID ─── */
.main-grid{display:grid;grid-template-columns:1fr 340px;gap:18px;margin-bottom:18px}

/* ─── CARD ─── */
.card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);
  padding:22px;position:relative;overflow:hidden}
.card-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:10px}
.card-title{font-size:13px;font-weight:600;letter-spacing:-.01em;color:var(--text1)}
.card-sub{font-size:10px;color:var(--text3);margin-top:2px;font-family:var(--mono)}
.tag{font-size:8px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;flex-shrink:0}
.tag.base{background:rgba(167,139,250,.1);color:var(--purple);border:1px solid rgba(167,139,250,.18)}
.tag.asp{background:var(--s-dim);color:var(--s-color);border:1px solid var(--s-border)}
.tag.ai{background:rgba(251,191,36,.08);color:var(--amber);border:1px solid rgba(251,191,36,.18)}
.tag.both{background:rgba(255,255,255,.04);color:var(--text2);border:1px solid var(--border2)}

/* ─── METRIC GRID ─── */
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.metric-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  padding:13px 15px;transition:background .2s}
.metric-item:hover{background:var(--bg3)}
.m-lbl{font-size:9px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;
  color:var(--text3);margin-bottom:6px}
.m-val{font-size:21px;font-weight:700;letter-spacing:-.02em;color:var(--text1);line-height:1}
.m-val.s   {color:var(--s-color)}
.m-val.green{color:var(--green)} .m-val.amber{color:var(--amber)}
.m-val.red{color:var(--red)} .m-val.purple{color:var(--purple)}
.m-note{font-size:10px;color:var(--text3);margin-top:3px}

/* ─── ZONE / GENERIC TABLE ─── */
.ztable{width:100%;border-collapse:collapse;margin-top:4px}
.ztable th{font-size:8px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;
  color:var(--text3);text-align:left;padding:0 0 9px;border-bottom:1px solid var(--border)}
.ztable td{font-size:12px;color:var(--text2);padding:9px 0;
  border-bottom:1px solid rgba(255,255,255,.025);vertical-align:middle}
.ztable td:not(:first-child){text-align:right}
.zdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:middle}

/* ─── BAR LIST (district rankings) ─── */
.bar-list{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:100px 1fr 46px;align-items:center;gap:9px}
.bar-name{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-name.top{color:var(--green);font-weight:600} .bar-name.bot{color:var(--red);font-weight:600}
.bar-track{height:7px;background:rgba(255,255,255,.05);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.bar-fill.green{background:linear-gradient(90deg,#059669,#34d399)}
.bar-fill.red{background:linear-gradient(90deg,#dc2626,#f87171)}
.bar-fill.amber{background:linear-gradient(90deg,#d97706,#fbbf24)}
.bar-fill.s{background:linear-gradient(90deg,var(--s-color2),var(--s-color))}
.bar-val{font-size:11px;font-family:var(--mono);color:var(--text2);text-align:right}
.bar-val.green{color:var(--green)} .bar-val.red{color:var(--red)} .bar-val.amber{color:var(--amber)}

/* ─── GP SUMMARY (district selected) ─── */
.gp-summary{display:flex;flex-direction:column;gap:10px}
.gp-stat-row{display:flex;align-items:center;justify-content:space-between;
  padding:11px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;transition:border-color .2s}
.gp-stat-row:hover{border-color:var(--border2)}
.gp-stat-label{font-size:12px;color:var(--text2)}
.gp-stat-val{font-size:18px;font-weight:700;font-family:var(--mono)}
.gp-stat-val.s{color:var(--s-color)} .gp-stat-val.green{color:var(--green)}
.gp-stat-val.amber{color:var(--amber)} .gp-stat-val.red{color:var(--red)}
.gp-scheme-note{margin-top:4px;padding:10px 13px;background:var(--s-dim);
  border:1px solid var(--s-border);border-radius:9px}
.gp-scheme-note .gsn-lbl{font-size:8px;font-family:var(--mono);color:var(--text3);
  text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.gp-scheme-note .gsn-val{font-size:12px;color:var(--text2)}

/* ─── DONUT ─── */
.ring-wrap{display:flex;align-items:center;gap:18px;margin-bottom:14px}
.ring-legend{display:flex;flex-direction:column;gap:7px;flex:1}
.rleg-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rleg-lbl{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}
.rleg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.rleg-val{font-size:12px;font-weight:700;font-family:var(--mono);color:var(--text1)}

/* ─── ASPIRATION BOTTOM ─── */
.asp-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}

/* ─── ITEM LIST ─── */
.item-list{display:flex;flex-direction:column;gap:7px}
.item-row{display:flex;align-items:center;justify-content:space-between;
  padding:9px 13px;background:var(--bg2);border:1px solid var(--border);
  border-radius:9px;gap:10px;transition:border-color .2s}
.item-row:hover{border-color:var(--border2)}
.item-row-left{flex:1;min-width:0}
.item-name{font-size:12px;font-weight:500;color:var(--text1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{font-size:9px;color:var(--text3);margin-top:2px;font-family:var(--mono)}
.item-count{font-size:16px;font-weight:700;font-family:var(--mono);color:var(--s-color);flex-shrink:0}

/* ─── PROG LIST ─── */
.prog-list{display:flex;flex-direction:column;gap:13px}
.prog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.prog-name{font-size:11px;color:var(--text2)}
.prog-val{font-size:11px;font-family:var(--mono);color:var(--text1)}
.prog-track{height:6px;background:rgba(255,255,255,.05);border-radius:999px;overflow:hidden}
.prog-fill{height:100%;border-radius:999px;transition:width 1.1s cubic-bezier(.4,0,.2,1)}
.prog-fill.s{background:linear-gradient(90deg,var(--s-color2),var(--s-color))}
.prog-fill.green{background:linear-gradient(90deg,#059669,#34d399)}
.prog-fill.amber{background:linear-gradient(90deg,#d97706,#fbbf24)}
.prog-fill.red{background:linear-gradient(90deg,#dc2626,#f87171)}
.prog-fill.purple{background:linear-gradient(90deg,#7c3aed,#a78bfa)}

/* ─── STATUS PILLS ─── */
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.spill{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.spill-count{font-size:22px;font-weight:700;font-family:var(--mono);line-height:1;margin-bottom:4px}
.spill-label{font-size:8px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--text3)}
.spill.accept .spill-count{color:var(--green)} .spill.review .spill-count{color:var(--amber)}
.spill.funded .spill-count{color:var(--s-color)} .spill.reject .spill-count{color:var(--red)}

/* ─── COVERAGE BARS ─── */
.cov-list{display:flex;flex-direction:column;gap:13px}
.cov-head{display:flex;justify-content:space-between;margin-bottom:5px}
.cov-label{font-size:11px;color:var(--text2)}
.cov-vals{font-size:11px;font-family:var(--mono)}
.cov-now{color:var(--text2)} .cov-tgt{color:var(--s-color)}
.cov-track{height:8px;background:rgba(255,255,255,.05);border-radius:999px;overflow:visible;position:relative}
.cov-fill{height:100%;border-radius:999px;position:absolute;top:0;left:0}
.cov-gap-fill{height:100%;border-radius:0 999px 999px 0;position:absolute;top:0}

/* ─── TALK TO DATA ─── */
.ttd-link{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;
  background:linear-gradient(135deg,var(--s-dim),rgba(34,211,238,.02));
  border:1px solid var(--s-border);border-radius:var(--r);margin-top:20px;
  cursor:pointer;transition:all .2s;text-decoration:none}
.ttd-link:hover{border-color:var(--s-color);filter:brightness(1.1)}
.ttd-left{display:flex;align-items:center;gap:11px}
.ttd-icon{font-size:18px} .ttd-text{font-size:13px;font-weight:600;color:var(--s-color)}
.ttd-sub{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:1px}
.ttd-arrow{font-size:16px;color:var(--s-color);opacity:.6}

/* ─── PRIORITY LABEL ─── */
.prio-lbl{font-size:9px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}

/* ─── RESPONSIVE ─── */
@media(max-width:1100px){.main-grid{grid-template-columns:1fr}.kpi-row{grid-template-columns:repeat(2,1fr)}.ai-grid{grid-template-columns:1fr}.asp-row{grid-template-columns:1fr}}
@media(max-width:680px){.kpi-row{grid-template-columns:1fr 1fr}.hero-headline{font-size:20px}.hero-stats{gap:20px}.shell{padding:0 16px 40px}.bar-row{grid-template-columns:80px 1fr 40px}}
</style>
</head>
<body>
<div class="shell" id="mainShell">
  <!-- Rendered by JS per sector -->
</div>

<script>
/* ══════════════════════════════════════════════════
   SECTOR DEFINITIONS
   Each sector has: id, name, icon, color, color2 (gradient start),
   baseline metrics, top aspiration items, zone data,
   coverage targets, district data, GP stats
══════════════════════════════════════════════════ */
const SECTORS = {

  /* ── 1. WATER & SANITATION ──────────────────── */
  water: {
    name:'Water & Sanitation', nameHi:'जल एवं स्वच्छता', icon:'💧',
    color:'#22d3ee', color2:'#0891b2',
    dim:'rgba(34,211,238,.10)', border:'rgba(34,211,238,.18)',
    glow:'rgba(34,211,238,.07)',
    heroHeadline:(d,gps)=>`FHTC at <span>${d.fhtc}</span> — last-mile distribution remains binding across <span>${gps}</span> GPs.`,
    heroDistHeadline:(d,dist)=>`${dist}: FHTC at <span>${d.fhtc}</span> — <span>${d.zeroFhtc || d.p1Gps}</span> GPs need urgent pipeline completion.`,
    kpis:[
      {label:'Rural FHTC Coverage',key:'fhtc',sub:d=>`Urban: <strong>${d.fhtcU}</strong>`,badge:'base',cls:'c-s'},
      {label:'Tap Connections Demanded',key:'tap',sub:d=>`Across <strong>${d.tapGps}</strong> GPs`,badge:'asp',cls:'c-green'},
      {label:'Avg Groundwater Depth',key:'gw',sub:d=>`Critical in <strong>7</strong> desert districts`,badge:'base',cls:'c-amber'},
      {label:'Tanker Dependent HH',key:'tanker',sub:d=>`<strong>${d.tankerGps}</strong> GPs still tanker-only`,badge:'asp',cls:'c-red'},
    ],
    heroStats:[
      {label:'FHTC Coverage',key:'fhtc',noteKey:'hsFhtcNote',noteCls:'warn'},

  const s = SECTORS[currentSector];
  const d = s.districtData[currentDistrict] || s.districtData['all'];
  return d[key] !== undefined ? d[key] : (s.districtData['all'][key] || '—');
}

function escape(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderTableRow(row){
  return '<tr>' + row.map((cell,i)=>{
    if(typeof cell === 'object' && cell !== null){
      if(cell.dot) return `<td><span class="zdot" style="background:${cell.dot}"></span>${escape(cell.name)}</td>`;
      if(cell.color) return `<td style="color:${cell.color}">${escape(cell.val)}</td>`;
      if(cell.val) return `<td>${escape(cell.val)}</td>`;
    }
    return i===0 ? `<td>${escape(cell)}</td>` : `<td>${escape(cell)}</td>`;
  }).join('')+'</tr>';
}

        <div><div class="card-title">Top Aspiration Items</div><div class="card-sub">By GP count · All planning years</div></div>
        <span class="tag asp">Aspiration</span>
      </div>
      <div class="item-list">${itemHtml}</div>
    </div>

    <!-- STATUS + PRIORITY -->
    <div class="card">
      <div class="card-hdr">
        <div><div class="card-title">Status &amp; Priority Breakdown</div><div class="card-sub">${s.name} sector · aspirations table</div></div>

      </div>
      <div class="status-grid">
        <div class="spill accept"><div class="spill-count">${aspD.accept}</div><div class="spill-label">Accepted</div></div>
        <div class="spill review"><div class="spill-count">${aspD.review}</div><div class="spill-label">Review</div></div>
        <div class="spill funded"><div class="spill-count">${aspD.funded}</div><div class="spill-label">Funded</div></div>
        <div class="spill reject"><div class="spill-count">${aspD.reject}</div><div class="spill-label">Rejected</div></div>
      </div>
      <div class="prio-lbl">Priority Distribution</div>
      <div class="prog-list">
        <div><div class="prog-head"><span class="prog-name">Priority 1 (High)</span><span class="prog-val" style="color:var(--red)">${priD.p1}%</span></div><div class="prog-track"><div class="prog-fill red" style="width:${priD.p1}%"></div></div></div>
        <div><div class="prog-head"><span class="prog-name">Priority 2 (Medium)</span><span class="prog-val" style="color:var(--amber)">${priD.p2}%</span></div><div class="prog-track"><div class="prog-fill amber" style="width:${priD.p2}%"></div></div></div>
        <div><div class="prog-head"><span class="prog-name">Priority 0 (Low)</span><span class="prog-val" style="color:var(--text3)">${priD.p0}%</span></div><div class="prog-track"><div class="prog-fill s" style="width:${priD.p0}%"></div></div></div>
      </div>
    </div>
  </div>`;

  document.getElementById('mainShell').innerHTML = html;
  setTimeout(refreshInsights, 300);
}

function buildTop5(d){
  const rows = (d.top5||[]).map(r=>`
    <div class="bar-row" style="margin-bottom:9px">
      <span class="bar-name top">${r.n}</span>
      <div class="bar-track"><div class="bar-fill green" style="width:${r.s}%"></div></div>
      <span class="bar-val green">${r.s}</span>
    </div>`).join('');
  return `<div class="bar-list">${rows}</div>`;
}

function buildBot5(d){
  return (d.bot5||[]).map(r=>`
    <div class="bar-row" style="margin-bottom:9px">
      <span class="bar-name bot">${r.n}</span>
      <div class="bar-track"><div class="bar-fill ${r.c}" style="width:${r.s}%"></div></div>
      <span class="bar-val ${r.c}">${r.s}</span>
    </div>`).join('');
}

function buildGpSnapshot(d){
  const s = SECTORS[currentSector];
  const gps     = d.gps     || '—';
  const p1Gps   = d.p1Gps   || '—';
  const revGps  = d.reviewGps || '—';
  const zero    = d.zeroFhtc !== undefined ? d.zeroFhtc : (d.p1Gps||'—');
  const scheme  = d.scheme || 'Connect live Supabase query for this district.';
  return `<div class="gp-summary">
    <div class="gp-stat-row"><span class="gp-stat-label">Total GPs in district</span><span class="gp-stat-val s">${gps}</span></div>
    <div class="gp-stat-row"><span class="gp-stat-label">GPs with P1 aspirations</span><span class="gp-stat-val red">${p1Gps}</span></div>
    <div class="gp-stat-row"><span class="gp-stat-label">GPs in REVIEW status</span><span class="gp-stat-val amber">${revGps}</span></div>
    <div class="gp-stat-row"><span class="gp-stat-label">Critical gap GPs</span><span class="gp-stat-val red">${zero}</span></div>
    <div class="gp-scheme-note"><div class="gsn-lbl">Scheme Status</div><div class="gsn-val">${scheme}</div></div>
  </div>`;
}

function onDistrictChange(){
  currentDistrict = document.getElementById('districtSelect').value;
  renderSector();
}

function setArea(area, btn){
  currentArea = area;
  document.querySelectorAll('#areaToggle .toggle-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

/* ── AI INSIGHTS ─────────────────────────────── */
async function refreshInsights(){
  const grid = document.getElementById('aiGrid');
  if(!grid) return;
  grid.innerHTML = '<div class="ai-loading"><div class="spin"></div>Manthaan AI is analyzing patterns…</div>';

  const s     = SECTORS[currentSector];
  const scope = currentDistrict==='all' ? 'all districts of Rajasthan' : currentDistrict+' district';
  const d     = key => getData(key);

  // Build context from first 4 baseline metrics
  const ctxLines = s.baselineMetrics.map(m=>`- ${m.label}: ${d(m.key)}`).join('\n');

  const prompt = `You are Manthaan AI for Viksit Rajasthan @ 2047.
Sector: ${s.name} (${s.nameHi})
Region: ${scope}

BASELINE DATA:
${ctxLines}

ASPIRATIONS:
- Total aspirations: ${d('aspCount')} across ${d('aspGps')||d('tapGps')||'—'} GPs
- Top item: ${s.topItems[0].name}
- Priority 1 share: ${d('aspCount')? (s.districtData[currentDistrict]||s.districtData['all']).pri?.p1+'%' : '—'}
- Status: ${(s.districtData[currentDistrict]||s.districtData['all']).asp?.review} in Review

Generate exactly 4 planning insights as a JSON array. Each:
- "type": one of "gap","trend","action","pattern"
- "icon": one emoji
- "text": 1-2 sentences with actual numbers in <strong> tags. Useful for a government officer. Mix Hindi naturally.
Return ONLY valid JSON array.`;

  try{
    const res  = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,
        messages:[{role:'user',content:prompt}]})
    });
    const data = await res.json();
    const raw  = (data.content||[]).map(b=>b.text||'').join('');
    renderInsights(JSON.parse(raw.replace(/```json|```/g,'').trim()));
  } catch {
    renderInsights([
      {type:'gap',    icon:'📊',text:`<strong>${d(s.baselineMetrics[0].key)}</strong> — ${s.baselineMetrics[0].note}. This is the primary baseline gap for ${s.name} in ${scope}.`},
      {type:'trend',  icon:'📈',text:`Top aspiration is <strong>${s.topItems[0].name}</strong> with <strong>${d(s.topItems[0].key)}</strong> GP demands — highest in this sector statewide.`},
      {type:'pattern',icon:'🔄',text:`<strong>${(s.districtData[currentDistrict]||s.districtData['all']).asp?.review}</strong> records in REVIEW — primarily R2-NOGIS (missing GPS). Field officer app data capture can unlock this backlog.`},
      {type:'action', icon:'✅',text:`Converge central and state schemes for ${s.name}. Three programmes running separately across GPs — unified planning can compress the 2030 delivery timeline.`},
    ]);
  }
}

function renderInsights(arr){
  const grid = document.getElementById('aiGrid');
  if(!grid) return;
  grid.innerHTML = arr.map((ins,i)=>`
    <div class="ai-card" style="animation-delay:${i*.07}s">
      <div class="ai-card-type ${ins.type}">${ins.icon} ${ins.type.toUpperCase()}</div>
      <div class="ai-card-text">${ins.text}</div>
    </div>`).join('');
}
